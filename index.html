<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b2032"><link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css"><title>Frais Proxi</title></head>
<body>
<header><h1>Frais <span>Proxi</span></h1><small>Gestion des DLC du frais</small></header>
<main>
<section id="home">
<div class="date"><b id="today"></b><small id="week"></small></div>
<button class="card red" onclick="filterList('today')"><b id="cToday">0</b><span>À retirer aujourd'hui</span></button>
<button class="card orange" onclick="filterList('tomorrow')"><b id="cTomorrow">0</b><span>À surveiller demain</span></button>
<button class="card green" onclick="filterList('week')"><b id="cWeek">0</b><span>Cette semaine</span></button>
<h2>Prochaines dates</h2><div id="days" class="days"></div>
<button class="add" onclick="show('add')">+ Ajouter une DLC</button>
</section>

<section id="add" hidden><h2>Ajouter un produit</h2>
<form id="form">
<label>Produit<input id="name" required placeholder="Ex : Yaourt nature"></label>
<label>Code-barres<input id="barcode" inputmode="numeric" placeholder="Facultatif"></label>
<label>Quantité<input id="qty" type="number" min="1" value="1" required></label>
<label>DLC<input id="dlc" type="date" required></label>
<label>Rayon<select id="rayon"><option>Frais</option><option>Crèmerie</option><option>Charcuterie</option><option>Traiteur</option><option>Épicerie</option><option>Autre</option></select></label>
<label>Notes<textarea id="notes" placeholder="Marque, taille, lot..."></textarea></label>
<button class="add" type="submit">Ajouter</button></form></section>

<section id="products" hidden><h2>Mes produits</h2>
<input id="search" placeholder="Rechercher un produit..." oninput="renderList()">
<div class="filters"><button onclick="filterList('all')">Tous</button><button onclick="filterList('today')">À retirer</button><button onclick="filterList('tomorrow')">Demain</button><button onclick="filterList('week')">Cette semaine</button></div>
<div id="list"></div></section>

<section id="stats" hidden><h2>Bilan de la semaine</h2><div id="statsBox"></div></section>
</main>
<nav><button onclick="show('home')">⌂<small>Accueil</small></button><button onclick="filterList('all')">▣<small>Produits</small></button><button class="plus" onclick="show('add')">+</button><button onclick="show('stats')">◷<small>Bilan</small></button></nav>
<script src="app.js"></script></body></html>
